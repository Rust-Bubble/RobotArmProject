[project]
name = "qiming-smart-hand"
version = "0.1.0"
description = "MLLM-based assistive robotic arm framework for visually impaired users."
requires-python = ">=3.10"
dependencies = [
    "pymycobot>=3.6.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0", 
    "asyncpg>=0.29.0",           # PostgreSQL 异步驱动
    "psycopg2-binary>=2.9.0",    # 可选，用于同步操作，但异步用 asyncpg
]
