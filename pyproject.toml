[project]
name = "qiming-smart-hand"
version = "0.1.0"
description = "MLLM-based assistive robotic arm framework for visually impaired users."
requires-python = ">=3.10"
dependencies = [
    "dashscope>=1.26.4",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "pymycobot>=3.6.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",           # PostgreSQL 异步驱动
    "psycopg2-binary>=2.9.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",                # passlib 1.7.4 与 bcrypt>=4.1 不兼容
    "python-multipart>=0.0.32",
    "email-validator>=2.3.0",
    "python-dotenv>=1.2.2"# 可选，用于同步操作，但异步用 asyncpg
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
