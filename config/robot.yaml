robot:
  model: "myCobot320PI"
  mode: "mock"
  port: "/dev/ttyAMA0"
  baudrate: 1000000
  default_speed: 35
  # 坐标运动模式：1 直线运动（sync_send_coords 的 mode=1），0 非线性（默认）
  coord_mode: 1
  # 同步发送坐标/角度后等待到位的超时时间（秒），超时后不再阻塞
  move_timeout: 15
  handover_coords: [80.0, -220.0, 180.0, 0.0, 0.0, 0.0]
  # 抓取时使用的末端姿态预设，见 src/qiming/arm_control/pose_presets.py
  grasp_preset: "top_down"
  # 放置/递送时使用的末端姿态预设
  place_preset: "top_down_place"
  gripper:
    # 夹爪类型：1 自适应 / 2 五指灵巧手 / 3 平行 / 4 柔性
    type: 4
    # 开合度（0~100，值越大越张开）
    open_value: 80
    close_value: 20
    open_speed: 50
    close_speed: 30
  # 逆运动学参数（改进 DH, 单位: deg / mm），留空则使用 kinematics.py 中的 myCobot 320 默认值
  kinematics:
    dh_params:
      - [0, 0, 173.9, 0]
      - [90, 0, 0, -90]
      - [0, -135, 0, 0]
      - [0, -120, 95, -90]
      - [90, 0, 87.78, 0]
      - [-90, 0, 65.5, 0]
    joint_limits:
      - [-168, 168]
      - [-135, 135]
      - [-145, 145]
      - [-148, 148]
      - [-168, 168]
      - [-180, 180]
  hand_eye_calibration:
    mode: "eye_to_hand"  # "eye_to_hand" 或 "eye_in_hand"
    calibration_times: 20
    chessboard_size: [9, 6]
    square_size: 0.025
    # TODO: 填入实际的相机内参矩阵 (接入相机后标定获取)
    intrinsic_matrix: null  # 3x3 矩阵，格式: [[fx, 0, cx], [0, fy, cy], [0, 0, 1]]
    dist_coeffs: null  # 畸变系数，5x1 或 8x1 向量
    # TODO: 填入实际的手眼标定外参 (完成标定后填入)
    T_BC: null  # 4x4 齐次变换矩阵 (Eye-to-Hand: 相机在基坐标系下的外参)
    T_CE: null  # 4x4 齐次变换矩阵 (Eye-in-Hand: 相机在末端坐标系下的外参)
  camera:
    sdk_path: "D:\\Documnet\\Other material\\3D摄像头客户资料\\驱动程序及SDK开发\\windows\\OpenNI2 SDK\\Windows_V2.3.0\\windows\\SDK\\x64\\Redist"
    calibration_img_dir: "D:\\camera_images"
    chessboard_size: [9, 6]
    square_size: 0.025